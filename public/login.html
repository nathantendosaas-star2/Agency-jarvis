<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Agency Jarvis | Administrator Login</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/login.js" defer></script>
</head>
<body class="login-page">
  <main class="login-card">
    <a class="brand login-brand" href="/login"><span class="brand-mark">J</span><span>AGENCY <strong>JARVIS</strong></span></a>
    <p class="eyebrow">ADMINISTRATOR ACCESS</p>
    <h1>Welcome back.</h1>
    <p class="muted">Sign in to access your agency workspace.</p>
    <form id="login-form" class="login-form">
      <label for="password">Administrator password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required minlength="1" maxlength="200" autofocus>
      <p id="login-error" class="login-error" role="alert" aria-live="polite"></p>
      <button id="login-button" class="login-submit" type="submit">Sign in <span aria-hidden="true">→</span></button>
    </form>
    <p class="login-footnote">Private administrator workspace</p>
  </main>
</body>
</html>
