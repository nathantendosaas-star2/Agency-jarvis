name: Agency Jarvis Autonomous Cycle
on:
  pull_request:
    paths:
      - '.github/workflows/agent-schedule.yml'
      - 'scripts/**'
      - 'src/agents/**'
      - 'src/services/**'
      - 'src/routes/agents.js'
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      force_run:
        description: Force a cycle now, while the global schedule is enabled
        required: false
        default: "false"
permissions:
  contents: read
concurrency:
  group: agency-jarvis-autonomous-runner
  cancel-in-progress: false
jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check autonomous JavaScript
        run: |
          node --check scripts/agent-runner.js
          node --check src/agents/specialistAgents.js
          node --check src/services/agentUsageService.js
          node --check src/routes/agents.js
  autonomous-cycle:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate required configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AGENT_MODEL_PRICING_JSON: ${{ secrets.AGENT_MODEL_PRICING_JSON }}
        run: node -e "for (const k of ['SUPABASE_URL','SUPABASE_SERVICE_ROLE_KEY','AGENT_MODEL_PRICING_JSON']) if (!process.env[k]) { console.error('Missing GitHub secret: '+k); process.exit(1) }"
      - name: Run due autonomous tasks
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          AGENT_MODEL_PRICING_JSON: ${{ secrets.AGENT_MODEL_PRICING_JSON }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          AGENT_FORCE_RUN: ${{ github.event.inputs.force_run || 'false' }}
          AGENT_TRIGGER: ${{ github.event_name }}
          AGENT_MAX_RUNTIME_SECONDS: "420"
          AGENT_MAX_TASKS: "10"
        run: node scripts/agent-runner.js
